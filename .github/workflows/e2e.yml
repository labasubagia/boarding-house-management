name: E2E

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_EMAIL: test@test.test
      E2E_PASSWORD: test123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Export Supabase env for the app
        run: |
          # status -o env is shell-sourceable (quoted values) — eval so GITHUB_ENV gets clean values
          eval "$(supabase status -o env)"
          test -n "$API_URL" || { echo "API_URL empty after supabase status" >&2; exit 1; }
          {
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY:-${ANON_KEY}}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY:-${SERVICE_ROLE_KEY}}"
          } >> "$GITHUB_ENV"

      - name: Create E2E test user
        run: |
          echo "Creating user at ${VITE_SUPABASE_URL}/auth/v1/admin/users"
          curl -fsS -X POST "${VITE_SUPABASE_URL}/auth/v1/admin/users" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${E2E_EMAIL}\",\"password\":\"${E2E_PASSWORD}\",\"email_confirm\":true}"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E (Supabase mode)
        run: npm run test:e2e:supabase

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            e2e/output/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
