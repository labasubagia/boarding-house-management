name: Supabase keep-alive

on:
  schedule:
    # Daily at 12:00 UTC (19:00 WIB) — prevents free-tier 7-day pause
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query database (counts as activity)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secrets" >&2
            exit 1
          fi
          curl -fsS -G \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/buildings?select=id&limit=1" \
            -o /dev/null -w "HTTP %{http_code}\n"
