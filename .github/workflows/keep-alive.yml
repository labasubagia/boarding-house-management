name: Supabase keep-alive

on:
  schedule:
    # Daily at 12:00 UTC (19:00 WIB) — prevents free-tier 7-day pause
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query database (counts as activity)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # Trim accidental whitespace/newlines from secrets
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          SUPABASE_ANON_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          # Strip wrapping quotes if pasted with them
          SUPABASE_URL="${SUPABASE_URL%\"}"; SUPABASE_URL="${SUPABASE_URL#\"}"
          SUPABASE_URL="${SUPABASE_URL%\'}"; SUPABASE_URL="${SUPABASE_URL#\'}"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secrets" >&2
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co|https://*.supabase.in) ;;
            *)
              echo "::error::VITE_SUPABASE_URL is not a https://*.supabase.co URL (got length ${#SUPABASE_URL}). Check the secret value in Settings → Secrets." >&2
              exit 1
              ;;
          esac
          case "$SUPABASE_ANON_KEY" in
            sb_publishable_*|eyJ*) ;;
            *)
              echo "::error::VITE_SUPABASE_ANON_KEY does not look like an anon/publishable key (length ${#SUPABASE_ANON_KEY})." >&2
              exit 1
              ;;
          esac

          echo "Pinging $SUPABASE_URL/rest/v1/buildings?select=id&limit=1"
          curl -fsS -G \
            --retry 3 --retry-delay 2 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL}/rest/v1/buildings?select=id&limit=1" \
            -o /dev/null -w "HTTP %{http_code}\n"
